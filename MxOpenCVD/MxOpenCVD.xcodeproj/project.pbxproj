			shellScript = "set -e\nif [ ! -d \"$SRCROOT/Vendor/onnxruntime/lib\" ]; then\n    echo \"error: Vendor libraries are missing. Run scripts/bootstrap.sh first.\"\n    exit 1\nfi\nFRAMEWORKS=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"\nmkdir -p \"$FRAMEWORKS\"\n# The dylib's install name is libonnxruntime.1.dylib, so that's the name it needs in the bundle.\n# Sign a new file and move it into place: overwriting in place kills any running copy of the app with a code-signature fault.\ncp -f \"$SRCROOT\"/Vendor/onnxruntime/lib/libonnxruntime.*.*.*.dylib \"$FRAMEWORKS/libonnxruntime.new\"\nchmod u+w \"$FRAMEWORKS/libonnxruntime.new\"\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" --options runtime --timestamp=none \"$FRAMEWORKS/libonnxruntime.new\"\nmv -f \"$FRAMEWORKS/libonnxruntime.new\" \"$FRAMEWORKS/libonnxruntime.1.dylib\"\nMODELS=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Models\"\nmkdir -p \"$MODELS\"\ncp -f \"$SRCROOT\"/Models/*.onnx \"$SRCROOT\"/Models/*.txt \"$MODELS/\"\n";
			showEnvVarsInLog = 0;
		};
